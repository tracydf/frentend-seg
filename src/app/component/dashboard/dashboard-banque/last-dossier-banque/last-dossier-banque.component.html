<div class="card">
  <div class="card-header card-no-border d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Derniers dossiers</h4>
    <a [routerLink]="['/dashboard']" class="text-decoration-none">Tout voir</a>
  </div>
  <div class="card-body pt-0">
    <div class="table-responsive custom-scrollbar">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="fw-semibold">No Dossier</th>
            <th class="fw-semibold">Statut</th>
            <th class="fw-semibold">Type</th>
            <th class="fw-semibold">Importateur</th>
            <th class="fw-semibold">Exportateur</th>
            <th class="fw-semibold">Transitaire</th>
            <th class="fw-semibold">Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td>
              <div class="numero-dossier">
                <a class="f-14 f-w-500" [routerLink]="['/dashboard']">{{ r.NoDossier }}</a>
              </div>
            </td>
            <td>
              <span class="badge" [ngClass]="badgeClass(r.Statut)">{{ r.Statut }}</span>
            </td>
            <td class="f-14 f-w-500">{{ r.Type }}</td>
            <td class="f-14 f-w-500">{{ r.Importateur }}</td>
            <td class="f-14 f-w-500">{{ r.Exportateur }}</td>
            <td class="f-14 f-w-500">{{ r.Transitaire }}</td>
            <td class="f-14 f-w-500">{{ r.Date | date:'dd MMM, yyyy' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
