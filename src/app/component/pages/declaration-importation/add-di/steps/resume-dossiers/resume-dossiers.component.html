<form [formGroup]="form" class="g-3">
  <!-- Bloc 1: Dossier -->
  <div class="mb-4">
    <h6 class="mb-3">Dossier <span class="badge bg-light text-dark">Elaboré</span></h6>
    <!-- 3 lignes x 3 colonnes -->
    <div class="row g-3">
      <!-- Ligne 1 -->
      <div class="col-12 col-md-4">
        <label class="form-label">No Dossier</label>
        <input type="text" class="form-control" formControlName="noDossier" placeholder="">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Type</label>
        <input type="text" class="form-control" formControlName="type">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Module</label>
        <input type="text" class="form-control" formControlName="module">
      </div>

      <!-- Ligne 2 -->
      <div class="col-12 col-md-4">
        <label class="form-label">Date début</label>
        <input type="date" class="form-control" formControlName="dateDebut">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Date fin</label>
        <input type="date" class="form-control" formControlName="dateFin">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Créé par</label>
        <input type="text" class="form-control" formControlName="creePar">
      </div>

      <!-- Ligne 3 -->
      <div class="col-12 col-md-4">
        <label class="form-label">Créé le</label>
        <input type="datetime-local" class="form-control" formControlName="creeLe">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Modifié le</label>
        <input type="datetime-local" class="form-control" formControlName="modifieLe">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Etat modifié</label>
        <input type="text" class="form-control" formControlName="etatModifie">
      </div>
    </div>
  </div>

  <!-- Blocs 2-3-4 en 3 colonnes -->
  <div class="row g-3">
    <!-- Bloc 2: Importateur -->
    <div class="col-12 col-lg-4">
      <div class="p-2 border rounded-3 h-100">
        <h6 class="mb-3">Importateur</h6>
        <label class="form-label">Nom</label>
        <input type="text" class="form-control mb-2" formControlName="importNom">
        <label class="form-label">Adresse</label>
        <input type="text" class="form-control mb-2" formControlName="importAdresse">
        <label class="form-label">Pays</label>
        <input type="text" class="form-control mb-2" formControlName="importPays">
        <label class="form-label">NIU</label>
        <input type="text" class="form-control" formControlName="importNIU">
      </div>
    </div>

    <!-- Bloc 3: Exportateur -->
    <div class="col-12 col-lg-4">
      <div class="p-2 border rounded-3 h-100">
        <h6 class="mb-3">Exportateur</h6>
        <label class="form-label">Nom</label>
        <input type="text" class="form-control mb-2" formControlName="exportNom">
        <label class="form-label">Adresse</label>
        <input type="text" class="form-control mb-2" formControlName="exportAdresse">
        <label class="form-label">Pays</label>
        <input type="text" class="form-control mb-2" formControlName="exportPays">
        <label class="form-label">NIU</label>
        <input type="text" class="form-control" formControlName="exportNIU">
      </div>
    </div>

    <!-- Bloc 4: Transitaire -->
    <div class="col-12 col-lg-4">
      <div class="p-2 border rounded-3 h-100">
        <h6 class="mb-3">Transitaire</h6>
        <label class="form-label">Nom</label>
        <input type="text" class="form-control mb-2" formControlName="transNom">
        <label class="form-label">Adresse</label>
        <input type="text" class="form-control mb-2" formControlName="transAdresse">
        <label class="form-label">Pays</label>
        <input type="text" class="form-control mb-2" formControlName="transPays">
        <label class="form-label">NIU</label>
        <input type="text" class="form-control" formControlName="transNIU">
      </div>
    </div>
  </div>
</form>
